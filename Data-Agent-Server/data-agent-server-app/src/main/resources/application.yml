# Local single-user runtime. No account, application DataSource, ORM or vector-store configuration.
server:
  port: 8081
spring:
  application:
    name: DataAgent
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
app:
  runtime:
    mode: local
  local:
    pi:
      enabled: true
  # local.data-directory defaults to ${user.home}/.data-agent/local.
  # The trusted host supplies exact allowed origins and the private stdio bootstrap.
